<div id="layout-scheduler" class="layout">
  <div class="layout-header">
    <div class="flexbox row shrink panel padding no-br">
      <div class="flexbox col shrink align-end">
        <h2 id="scheduler-title">Scheduler</h2>
      </div>
    </div>
  </div>
  <div class="layout-content">
    <div class="xtabs panel no-tr">
      <div class="col scheduler-panel">

        <div class="flexbox row scheduler-toolbar">
          <div>
            <div id="scheduler-mode" class="scheduler-mode" role="group" aria-label="Scheduler mode">
              <button id="scheduler-mode-active" class="sd-button" type="button" aria-pressed="false"><div class="mask-icon icon-forward"></div></button>
              <button id="scheduler-mode-paused" class="sd-button" type="button" aria-pressed="false"><div class="mask-icon icon-pause"></div></button>
              <button id="scheduler-mode-auto" class="sd-button" type="button" aria-pressed="false"><div class="mask-icon icon-playpause"></div></button>
            </div>
            <div id="scheduler-window">
              <label for="scheduler-window-start"><span id="scheduler-label-active-time">Active time</span></label>
              <input id="scheduler-window-start" type="time" />
              <label for="scheduler-window-end"> - </label>
              <input id="scheduler-window-end" type="time" />
            </div>
          </div>
          <div id="scheduler-worker-status" role="status"></div>
        </div>

        <div class="flexbox row scheduler-toolbar">
          <div>
            <input id="scheduler-search" type="search" placeholder="search string..." />
            <select id="scheduler-status-filter" aria-label="Filter tasks by status">
              <option value="">All statuses</option>
              <option value="scheduled">Scheduled</option>
              <option value="running">Running</option>
              <option value="paused">Paused</option>
              <option value="completed">Completed</option>
              <option value="failed">Failed</option>
            </select>
          </div>
          <div>
            <button id="scheduler-refresh" class="sd-button" type="button" aria-label="Refresh" title="Refresh"><div class="mask-icon icon-refresh" aria-hidden="true"></div></button>
            <button id="scheduler-load-more" class="sd-button" type="button" aria-label="Load more tasks" title="Load more tasks" hidden><div class="mask-icon icon-plus" aria-hidden="true"></div></button>
          </div>
        </div>

        <div id="scheduler-grid" aria-label="Scheduled generation tasks"></div>

        <div style="display: flex">
          <div class="flexbox row shrink scheduler-prune">
            <input id="scheduler-prune-before" type="datetime-local" />
            <button id="scheduler-prune" class="sd-button" type="button" title="Prune tasks older than"><div class="mask-icon icon-delete" aria-hidden="true"></div></button>
          </div>
          <div id="scheduler-message" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </div>
</div>
