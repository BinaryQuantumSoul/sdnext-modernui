<div id="scheduler-details" class="col full-height border-padding scheduler-details">

  <div class="flexbox row shrink panel padding scheduler-details-header">
    <h2 id="scheduler-details-title">Task details</h2>
  </div>

  <div class="flexbox column">
    <section id="scheduler-control-common" class="scheduler-detail-section panel">
      <h2 id="scheduler-parameters-title">Parameters</h2>
      <button id="scheduler-parameters-save" class="sd-button" type="button" aria-label="Save task parameters" title="Save task parameters" disabled>
        <div class="mask-icon icon-save" aria-hidden="true"></div>
      </button>
      <label class="scheduler-common-parameter scheduler-common-parameter-wide" for="scheduler-reschedule-at"><span id="scheduler-label-run-at">Run at</span><input id="scheduler-reschedule-at" type="datetime-local" aria-label="Reschedule task time" /></label>
      <label class="scheduler-common-parameter scheduler-common-parameter-wide" for="scheduler-common-prompt"><span id="scheduler-label-prompt">Prompt</span><textarea id="scheduler-common-prompt" rows="2"></textarea></label>
      <label class="scheduler-common-parameter scheduler-common-parameter-wide" for="scheduler-common-negative_prompt"><span id="scheduler-label-negative">Negative</span><textarea id="scheduler-common-negative_prompt" rows="2"></textarea></label>
      <label class="scheduler-common-parameter" for="scheduler-common-steps"><span id="scheduler-label-steps">Steps</span><input id="scheduler-common-steps" type="number" min="1" step="1" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-width_before"><span id="scheduler-label-width">Width</span><input id="scheduler-common-width_before" type="number" min="1" step="1" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-height_before"><span id="scheduler-label-height">Height</span><input id="scheduler-common-height_before" type="number" min="1" step="1" /></label>
    </section>

    <section id="scheduler-control-model" class="scheduler-detail-section panel">
      <h2 id="scheduler-model-title">Model</h2>
      <label class="scheduler-common-parameter" for="scheduler-common-sd_model_checkpoint"><span id="scheduler-label-model">Model</span><input id="scheduler-common-sd_model_checkpoint" type="text" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-sd_model_refiner"><span id="scheduler-label-refiner">Refiner</span><input id="scheduler-common-sd_model_refiner" type="text" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-sd_unet"><span id="scheduler-label-unet">Unet</span><input id="scheduler-common-sd_unet" type="text" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-sd_vae"><span id="scheduler-label-vae">VAE</span><input id="scheduler-common-sd_vae" type="text" /></label>
      <label class="scheduler-common-parameter" for="scheduler-common-sd_text_encoder"><span id="scheduler-common-sd_text_encoder-label">TE</span><input id="scheduler-common-sd_text_encoder" type="text" /></label>
    </section>

    <section class="scheduler-detail-section panel">
      <h2 id="scheduler-advanced-title">Advanced</h2>
      <div>
        <textarea id="scheduler-parameters" spellcheck="false" aria-label="Task parameters JSON" placeholder="Select a task to view parameters"></textarea>
      </div>
    </section>
  </div>

  <div></div>

  <div class="flexbox column">
    <section class="scheduler-detail-section panel">
      <h2 id="scheduler-results-title">Results</h2>
      <div id="scheduler-results">
        <h3>Process</h3>
        <div id="scheduler-process-header"></div>
        <div id="scheduler-process-stats"></div>
        <h3>Infotexts</h3>
        <div id="scheduler-process-infotexts"></div>
      </div>
    </section>

    <section class="scheduler-detail-section panel">
      <h2 id="scheduler-inputs-title">Inputs</h2>
      <div id="scheduler-input-previews" class="scheduler-media-list"></div>
    </section>

    <section class="scheduler-detail-section panel">
      <h2 id="scheduler-outputs-title">Outputs</h2>
      <div id="scheduler-result-previews" class="scheduler-media-list"></div>
    </section>
  </div>

</div>
